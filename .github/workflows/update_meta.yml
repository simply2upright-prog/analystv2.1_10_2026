name: Update Ticker Meta
on:
  schedule:
    - cron: '0 5 * * 0'        # sonntags 05:00 UTC
  workflow_dispatch:
    inputs:
      isin:
        description: 'ISIN mit abrufen (langsamer)'
        type: boolean
        default: true

permissions:
  contents: write              # zum Zurückschreiben von ticker_meta.json

concurrency:
  group: update-meta
  cancel-in-progress: false

jobs:
  meta:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: pip
      - run: pip install -r requirements.txt
      - name: Metadaten holen
        run: python build_ticker_meta.py ${{ (github.event_name == 'schedule' || inputs.isin) && '--isin' || '' }}
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ticker_meta.json
          if git diff --cached --quiet; then
            echo "Keine Änderungen."
          else
            git commit -m "Update ticker_meta.json"
            git push
          fi
